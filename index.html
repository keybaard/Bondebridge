<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bondebridge">
<meta name="theme-color" content="#1f5a43">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231f5a43'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='%23fff'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<title>Bondebridge-blokka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one column scorepad; standings pinned on top, current round below, round log as a ruled sheet */
:root{
  --bg:#eef1ee; --paper:#ffffff; --ink:#1d2a24; --muted:#5f6f67; --line:#d5ddd8;
  --felt:#1f5a43; --felt-ink:#ffffff; --red:#b3262f; --good:#1f7a4d; --warn:#9a6200;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --paper:#17221d; --ink:#e7eee9; --muted:#9aaba2; --line:#2a3a33;
  --felt:#2f7d5e; --felt-ink:#ffffff; --red:#ef6a70; --good:#5fcf95; --warn:#e9b04c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --paper:#17221d; --ink:#e7eee9; --muted:#9aaba2; --line:#2a3a33;
  --felt:#2f7d5e; --felt-ink:#ffffff; --red:#ef6a70; --good:#5fcf95; --warn:#e9b04c; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding:0 16px 40px;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.7rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--felt);outline-offset:2px}
.btn{background:var(--felt);color:var(--felt-ink);padding:14px 18px;font-weight:700;font-size:1rem;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{width:auto;padding:8px 12px;font-size:.9rem}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0}
.row{display:flex;gap:8px;align-items:center}
.row > *{min-width:0}

/* header */
header{padding-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.suits{color:var(--red);font-size:1.1rem;letter-spacing:.15em}

/* standings */
.standings{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin:0 -16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.st-list{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.st-list::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:84px;display:flex;flex-direction:column;gap:2px}
.chip.lead{background:var(--felt);color:var(--felt-ink);border-color:var(--felt)}
.chip .n{font-size:.85rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.chip .t{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1}
.chip .d{font-size:.75rem;opacity:.75}

/* round */
.roundhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cards{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1}
.cards small{font-family:var(--body);font-size:.9rem;font-weight:400;color:var(--muted);margin-left:4px}
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.pname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname .sub{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.dealer{display:inline-block;font-size:.7rem;background:var(--red);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;font-weight:700}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:1.3rem;font-weight:700}
.step output{min-width:40px;text-align:center;font-family:var(--display);font-weight:800;font-size:1.4rem}
.step input{width:72px;text-align:center;padding:10px 4px}
.sum{display:flex;justify-content:space-between;gap:8px;font-size:.95rem;padding:10px 12px;border-radius:10px;background:var(--bg)}
.sum.ok{color:var(--good)} .sum.bad{color:var(--red)} .sum.warn{color:var(--warn)}
.pts{font-weight:700}
.pts.hit{color:var(--good)} .pts.miss{color:var(--red)}

/* log */
.logwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--paper)}
thead th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tbody tr[data-edit]{cursor:pointer}
tbody tr[data-edit]:hover td{background:var(--bg)}
td .bt{display:block;font-size:.72rem;color:var(--muted)}
td.hit{color:var(--good);font-weight:700} td.miss{color:var(--red)}
tfoot td{font-weight:800;font-family:var(--display);font-size:1.05rem;border-bottom:0}
.hint{font-size:.85rem;color:var(--muted);margin:0}

/* setup */
.plrow{display:flex;gap:8px}
.plrow button{flex:0 0 44px;background:var(--bg);color:var(--red);border:1px solid var(--line);font-size:1.2rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.confirm{background:var(--bg);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.winner{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.winner .big{font-family:var(--display);font-weight:800;font-size:2rem}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--felt);color:var(--felt-ink);border-color:var(--felt)}
/* share + board */
.qrbox{background:#ffffff;padding:14px;border-radius:12px;align-self:center;line-height:0}
.qrbox img,.qrbox canvas{width:220px;height:220px;max-width:100%}
.linkline{display:flex;gap:8px;align-items:center}
.linkline code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:.8rem;user-select:all}
.status{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.on i{background:var(--good)} .status.off i{background:var(--red)}
.board-now{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.bigtable{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:2rem 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .r{font-family:var(--display);font-weight:800;color:var(--muted);font-size:1.1rem}
.brow .nm{font-weight:700;font-size:1.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .nm .sub{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.brow .tt{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1}
.brow.first .r,.brow.first .tt{color:var(--felt)}
details summary{cursor:pointer;font-weight:700}
@media (prefers-reduced-motion:no-preference){.chip{transition:background .2s}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
const KEY='bondebridge-v1';
const NTFY='https://ntfy.sh/';
const params=new URLSearchParams(location.search);
const VIEW_ID=(params.get('g')||'').replace(/[^a-z0-9]/gi,'');
let MODE=VIEW_ID?'board':'keeper';
let SYNC=MODE==='board'?'wait':'idle';   // idle | wait | on | off
let REMOTE=null;       // last snapshot received (board)
let showShare=false;
// keeper's game id: random, kept on this phone so the QR code stays the same all evening
function gameId(){
  let id=null;try{id=localStorage.getItem(KEY+'-id')}catch(e){}
  if(!id){const a='abcdefghijkmnpqrstuvwxyz23456789';id='';const r=crypto.getRandomValues(new Uint8Array(14));r.forEach(x=>id+=a[x%a.length]);try{localStorage.setItem(KEY+'-id',id)}catch(e){}}
  return id;
}
const GID=MODE==='board'?VIEW_ID:gameId();
const TOPIC='bondebridge-'+GID;
const BOARD_URL=location.origin+location.pathname+'?g='+GID;
const load=()=>{try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}};
const save=()=>{if(MODE==='board')return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const DEMO={phase:'setup',players:['Ola','Kari','Per','Lise'],
  settings:{maxCards:10,order:'down',scoring:'ten',dealerBlock:false,firstDealer:0},
  rounds:[],draft:null,editing:null,confirmNew:false};
let S=load()||JSON.parse(JSON.stringify(DEMO));

// ---- rules ----
function schedule(){
  const m=S.settings.maxCards, down=[],up=[];
  for(let c=m;c>=1;c--)down.push(c);
  for(let c=1;c<=m;c++)up.push(c);
  return S.settings.order==='down'?down.concat(up):up.concat(down);
}
function maxAllowed(n){return Math.max(1,Math.floor(52/Math.max(n,1)))}
function score(bid,tricks,manual){
  if(S.settings.scoring==='manual')return manual||0;
  if(bid===tricks)return 10+tricks;
  if(S.settings.scoring==='minus')return -Math.abs(bid-tricks);
  return 0;
}
function totals(){
  const t=S.players.map(()=>0);
  S.rounds.forEach(r=>r.e.forEach((e,i)=>t[i]+=e.p));
  return t;
}
function dealerFor(ri){return (S.settings.firstDealer+ri)%S.players.length}
function newDraft(){
  const ri=S.rounds.length, cards=schedule()[ri];
  return {cards,stage:S.settings.scoring==='manual'?'tricks':'bids',
    e:S.players.map(()=>({b:0,t:0,m:0}))};
}

// ---- helpers ----
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
function stepper(id,val,min,max){
  return `<div class="step"><button type="button" data-step="${id}" data-d="-1" aria-label="Minus" ${val<=min?'disabled':''}>−</button>
  <output>${val}</output><button type="button" data-step="${id}" data-d="1" aria-label="Pluss" ${val>=max?'disabled':''}>+</button></div>`;
}

// ---- render ----
function render(){
  const app=$('#app');
  if(MODE==='board'){app.innerHTML=boardView();return}
  if(S.phase==='setup'){app.innerHTML=setupView()+shareView();drawQR();return}
  app.innerHTML=standingsView()+ (S.phase==='done'?doneView():roundView()) + logView() + shareView() + footerView();
  drawQR();
}

// ---- shared scoreboard (ntfy.sh pub/sub, no accounts) ----
function statusView(){
  const t={idle:'Klar – sendes når du lagrer',wait:'Kobler til …',on:MODE==='board'?'Live':'Tavla er live',off:'Ikke tilkoblet'}[SYNC];
  return `<span class="status ${SYNC}" role="status"><i></i>${t}</span>`;
}
function shareView(){
  return `<section class="panel">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap"><h2>Tavle for de andre</h2>${statusView()}</div>
    ${showShare?`
      <div class="qrbox" id="qr" aria-label="QR-kode til tavla"></div>
      <div class="linkline"><code id="boardlink">${esc(BOARD_URL)}</code><button class="btn small" data-act="copy" id="copybtn">Kopier</button></div>
      <p class="hint">Alle med lenken ser stillingen, runden og poengblokka, uten konto. Den oppdateres av seg selv når du lagrer en runde. Koden er den samme hele kvelden, også når dere starter nytt spill.</p>
      <button class="btn ghost small" data-act="hideShare">Skjul QR-kode</button>`
    :`<button class="btn ghost" data-act="showShare">Vis QR-kode og lenke</button>`}
    ${SYNC==='off'?'<p class="hint">Fikk ikke sendt til tavla (sjekk nettet). Stillingen lagres fortsatt på denne telefonen, og sendes igjen neste gang du lagrer.</p>':''}
  </section>`;
}
function drawQR(){
  const el=document.getElementById('qr');if(!el)return;
  if(typeof QRCode==='undefined'){el.outerHTML='<p class="hint">QR-koden lastet ikke. Kopier lenken i stedet.</p>';return}
  try{new QRCode(el,{text:BOARD_URL,width:440,height:440,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){}
}
function boardView(){
  const head=`<header><div><div class="suits" aria-hidden="true">♠♥♦♣</div><h1>Bondebridge-tavla</h1></div>${statusView()}</header>`;
  if(!REMOTE){
    const msg=SYNC==='off'?'Får ikke kontakt med tavla. Sjekk nettet – den kobler seg til igjen av seg selv.'
      :SYNC==='wait'?'Henter stillingen …':'Ingen stilling ennå. Den dukker opp her når føreren starter spillet.';
    return head+`<section class="panel"><p style="margin:0">${msg}</p></section>`;
  }
  const t=totals(), order=t.map((v,i)=>i).sort((a,b)=>t[b]-t[a]), top=t[order[0]];
  const sch=schedule(), n=REMOTE.now;
  let now='';
  if(S.phase==='done')now=doneView();
  else if(S.phase==='play'&&n){
    const bids=n.bids?`<div class="sum"><span>Meldt: ${n.bids.map((b,i)=>`${esc(S.players[i])} <b>${b}</b>`).join(' · ')}</span><span>${n.bids.reduce((a,b)=>a+b,0)} av ${n.cards}</span></div>`:'<p class="hint">Meldingene er ikke lagt inn ennå.</p>';
    now=`<section class="panel"><div class="board-now"><div><div class="lbl">Runde ${n.round+1} av ${sch.length}</div><div class="cards">${n.cards}<small>kort hver</small></div></div><div class="lbl">Giver: ${esc(S.players[n.dealer]||'')}</div></div>${bids}</section>`;
  }
  const list=`<section class="panel"><div class="row" style="justify-content:space-between"><h2>Stilling</h2><span class="lbl">${S.rounds.length} ${S.rounds.length===1?'runde':'runder'} spilt</span></div>
    <div class="bigtable">${order.map((i,rank)=>{const lead=t[i]===top&&S.rounds.length>0;
      const last=S.rounds.length?S.rounds[S.rounds.length-1].e[i].p:null;
      return `<div class="brow ${lead?'first':''}"><span class="r">${rank+1}</span><span class="nm">${esc(S.players[i])}<span class="sub">${lead?'leder':(t[i]-top)+' bak'}${last!==null?` · sist ${last>0?'+':''}${last}`:''}</span></span><span class="tt">${t[i]}</span></div>`}).join('')}</div></section>`;
  return head+now+list+logView();
}
// compact wire format keeps a full 20-round game well under ntfy's 4 KB message limit
function encode(){
  const st=S.settings;
  const n=(S.phase==='play'&&S.draft&&S.editing===null)
    ?[S.rounds.length,S.draft.cards,dealerFor(S.rounds.length),(st.scoring!=='manual'&&S.draft.stage==='tricks')?S.draft.e.map(e=>e.b):0]:0;
  return {v:1,p:S.players,s:[st.maxCards,st.order,st.scoring,st.firstDealer],ph:S.phase,
    r:S.rounds.map(r=>[r.cards].concat(...r.e.map(e=>[e.b,e.t,e.p]))),n};
}
function decode(d){
  if(!d||d.v!==1||!Array.isArray(d.p))return null;
  const k=d.p.length;
  const rounds=(d.r||[]).map(a=>({cards:a[0],e:d.p.map((_,i)=>({b:a[1+i*3],t:a[2+i*3],p:a[3+i*3]}))}));
  return {players:d.p.map(String),settings:{maxCards:d.s[0],order:d.s[1],scoring:d.s[2],firstDealer:d.s[3],dealerBlock:false},
    rounds,phase:d.ph,now:d.n?{round:d.n[0],cards:d.n[1],dealer:d.n[2],bids:d.n[3]||null}:null};
}
let lastPushed='',pushTimer=null,pushing=false;
function schedulePush(){
  if(MODE!=='keeper')return;
  clearTimeout(pushTimer);pushTimer=setTimeout(push,700);
}
async function push(){
  if(pushing){schedulePush();return}
  if(S.phase==='setup')return; // the board keeps the last game until a new one starts
  const body=JSON.stringify(encode());
  if(body===lastPushed&&SYNC==='on')return;
  pushing=true;
  try{
    const r=await fetch(NTFY+TOPIC,{method:'POST',body});
    if(!r.ok)throw new Error(r.status);
    lastPushed=body;if(SYNC!=='on'){SYNC='on';render()}
  }catch(e){if(SYNC!=='off'){SYNC='off';render()}}
  finally{pushing=false}
}
let es=null;
function listen(){
  if(MODE!=='board'||!GID)return;
  try{es&&es.close()}catch(e){}
  es=new EventSource(NTFY+TOPIC+'/sse?since=latest');
  es.onopen=()=>{if(SYNC!=='on'){SYNC='on';render()}};
  es.onmessage=ev=>{
    try{
      const m=JSON.parse(ev.data);if(m.event&&m.event!=='message')return;
      const g=decode(JSON.parse(m.message));if(!g)return;
      REMOTE=g;S={players:g.players,settings:g.settings,rounds:g.rounds,phase:g.phase,draft:null,editing:null};
      SYNC='on';render();
    }catch(e){}
  };
  es.onerror=()=>{const s=es.readyState===2?'off':'wait';if(SYNC!==s){SYNC=s;render()}};
}
function connect(){
  if(MODE==='board'){listen();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(!es||es.readyState===2))listen()});
  }else if(S.phase!=='setup')schedulePush();
}

function setupView(){
  const n=S.players.filter(p=>p.trim()).length, cap=maxAllowed(n);
  const mc=Math.min(S.settings.maxCards,cap);
  const s=S.settings;
  return `<header><div><div class="suits" aria-hidden="true">♠♥♦♣</div><h1>Bondebridge-blokka</h1></div></header>
  <section class="panel">
    <div class="row" style="justify-content:space-between"><h2>Spillere</h2><span class="lbl">${n} med</span></div>
    ${S.players.map((p,i)=>`<div class="plrow"><input type="text" id="pl${i}" data-pl="${i}" value="${esc(p)}" placeholder="Navn" autocomplete="off"><button type="button" data-rm="${i}" aria-label="Fjern ${esc(p)}">×</button></div>`).join('')}
    <button class="btn ghost" data-act="addp" ${S.players.length>=8?'disabled':''}>+ Legg til spiller</button>
    <p class="hint">Rekkefølgen her er rekkefølgen rundt bordet. Giver går videre med klokka hver runde.</p>
  </section>
  <section class="panel">
    <h2>Oppsett</h2>
    <div class="grid2">
      <div class="field"><label class="lbl" for="mc">Flest kort</label>
        <select id="mc" data-set="maxCards">${Array.from({length:cap},(_,i)=>i+1).reverse().map(c=>`<option ${c===mc?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label class="lbl" for="ord">Rekkefølge</label>
        <select id="ord" data-set="order"><option value="down" ${s.order==='down'?'selected':''}>${mc} → 1 → ${mc}</option><option value="up" ${s.order==='up'?'selected':''}>1 → ${mc} → 1</option></select></div>
      <div class="field"><label class="lbl" for="sc">Poeng</label>
        <select id="sc" data-set="scoring">
          <option value="ten" ${s.scoring==='ten'?'selected':''}>Klart: 10 + stikk · bom: 0</option>
          <option value="minus" ${s.scoring==='minus'?'selected':''}>Klart: 10 + stikk · bom: −1 per stikk</option>
          <option value="manual" ${s.scoring==='manual'?'selected':''}>Skriv inn poeng selv</option></select></div>
      <div class="field"><label class="lbl" for="fd">Første giver</label>
        <select id="fd" data-set="firstDealer">${S.players.map((p,i)=>`<option value="${i}" ${i===s.firstDealer?'selected':''}>${esc(p||'Spiller '+(i+1))}</option>`).join('')}</select></div>
    </div>
    <label class="row" style="gap:10px"><input type="checkbox" id="db" data-set="dealerBlock" ${s.dealerBlock?'checked':''} style="width:22px;height:22px"> <span>Giver kan ikke melde så summen går opp i antall kort</span></label>
    <p class="hint">${mc*2} runder totalt. Med ${n||'?'} spillere er ${cap} kort maks (52 ÷ ${n||'?'}).</p>
  </section>
  <button class="btn" data-act="start" ${n<2?'disabled':''}>Start spill</button>`;
}

function standingsView(){
  const t=totals(), order=t.map((v,i)=>i).sort((a,b)=>t[b]-t[a]), top=t[order[0]];
  return `<div class="standings"><div class="st-list" aria-label="Stilling">${order.map((i,rank)=>{
    const lead=t[i]===top&&S.rounds.length>0;
    return `<div class="chip ${lead?'lead':''}"><span class="n">${rank+1}. ${esc(S.players[i])}</span><span class="t">${t[i]}</span><span class="d">${lead?'leder':(t[i]-top)}</span></div>`}).join('')}</div></div>`;
}

function roundView(){
  const sch=schedule(), ri=S.editing!==null?S.editing:S.rounds.length;
  const d=S.draft, cards=d.cards, dealer=dealerFor(ri), manual=S.settings.scoring==='manual';
  const bidSum=d.e.reduce((a,e)=>a+e.b,0), trickSum=d.e.reduce((a,e)=>a+e.t,0);
  let body='', sum='', action='';
  const nameCell=(i,sub)=>`<div class="pname">${esc(S.players[i])}${i===dealer?'<span class="dealer">Giver</span>':''}${sub?`<span class="sub">${sub}</span>`:''}</div>`;
  const seat=i=>(dealer+1+i)%S.players.length; // bidding order: left of dealer first
  const idxs=S.players.map((_,i)=>seat(i));

  if(manual){
    body=idxs.map(i=>`<div class="prow">${nameCell(i)}<div class="step"><button type="button" data-step="m${i}" data-d="-1" aria-label="Minus">−</button><input type="number" id="m${i}" data-man="${i}" value="${d.e[i].m}" inputmode="numeric"><button type="button" data-step="m${i}" data-d="1" aria-label="Pluss">+</button></div></div>`).join('');
    action=`<button class="btn" data-act="saveRound">${S.editing!==null?'Lagre endring':'Lagre runde'}</button>`;
  } else if(d.stage==='bids'){
    body=idxs.map(i=>`<div class="prow">${nameCell(i)}${stepper('b'+i,d.e[i].b,0,cards)}</div>`).join('');
    const blocked=S.settings.dealerBlock&&bidSum===cards;
    const cls=blocked?'bad':bidSum===cards?'warn':'';
    const txt=bidSum>cards?`${bidSum-cards} for mye meldt – noen går bom`:bidSum<cards?`${cards-bidSum} stikk til overs – noen får flere enn meldt`:'Går akkurat opp';
    sum=`<div class="sum ${cls}"><span>Meldt: <b>${bidSum}</b> av ${cards}</span><span>${blocked?'Giver må endre':txt}</span></div>`;
    action=`<button class="btn" data-act="toTricks" ${blocked?'disabled':''}>Meldinger er satt → spill runden</button>`;
  } else {
    body=idxs.map(i=>{const e=d.e[i],p=score(e.b,e.t);
      return `<div class="prow">${nameCell(i,`Meldte ${e.b} · <span class="pts ${e.b===e.t?'hit':'miss'}">${p>0?'+':''}${p}</span>`)}${stepper('t'+i,e.t,0,cards)}</div>`}).join('');
    const ok=trickSum===cards;
    sum=`<div class="sum ${ok?'ok':'bad'}"><span>Stikk: <b>${trickSum}</b> av ${cards}</span><span>${ok?'Stemmer':trickSum<cards?`Mangler ${cards-trickSum}`:`${trickSum-cards} for mange`}</span></div>`;
    action=`<div class="row"><button class="btn ghost small" data-act="toBids">← Meldinger</button><button class="btn" data-act="saveRound" ${ok?'':'disabled'}>${S.editing!==null?'Lagre endring':'Lagre runde'}</button></div>`;
  }
  const stageLbl=manual?'Poeng':d.stage==='bids'?'Steg 1 · Meldinger':'Steg 2 · Stikk tatt';
  return `<section class="panel" id="round">
    <div class="roundhead"><div><div class="lbl">${S.editing!==null?'Redigerer runde':'Runde'} ${ri+1} av ${sch.length}</div><div class="cards">${cards}<small>kort hver</small></div></div><div class="lbl">${stageLbl}</div></div>
    <div class="plist">${body}</div>${sum}${action}
    ${S.editing!==null?'<button class="btn ghost small" data-act="cancelEdit">Avbryt redigering</button>':''}
  </section>`;
}

function doneView(){
  const t=totals(), top=Math.max(...t), w=S.players.filter((p,i)=>t[i]===top);
  return `<section class="panel winner"><div class="suits" aria-hidden="true">♠♥♦♣</div><div class="lbl">Ferdig spilt</div><div class="big">${w.map(esc).join(' og ')}</div><p class="hint" style="margin:0">vant med ${top} poeng</p></section>`;
}

function logView(){
  if(!S.rounds.length)return `<p class="hint">Rundene dukker opp her når de er lagret. Trykk på en runde for å rette den.</p>`;
  const t=totals(), manual=S.settings.scoring==='manual', ro=MODE==='board';
  return `<section style="display:flex;flex-direction:column;gap:8px"><div class="row" style="justify-content:space-between"><h2>Poengblokka</h2>${ro?'':'<span class="hint">Trykk rad for å rette</span>'}</div>
  <div class="logwrap"><table><thead><tr><th>Rd · kort</th>${S.players.map(p=>`<th>${esc(p)}</th>`).join('')}</tr></thead>
  <tbody>${S.rounds.map((r,ri)=>`<tr ${ro?'':`data-edit="${ri}" tabindex="0"`}><td>${ri+1} · ${r.cards}</td>${r.e.map(e=>{
    const hit=!manual&&e.b===e.t;return `<td class="${manual?'':hit?'hit':'miss'}">${e.p}${manual?'':`<span class="bt">${e.b}/${e.t}</span>`}</td>`}).join('')}</tr>`).join('')}</tbody>
  <tfoot><tr><td>Sum</td>${t.map(v=>`<td>${v}</td>`).join('')}</tr></tfoot></table></div>
  ${manual?'':'<p class="hint">Små tall: meldt / tatt.</p>'}</section>`;
}

function footerView(){
  return `<section class="panel">
    ${S.confirmNew?`<div class="confirm"><b>Slette dette spillet og starte på nytt?</b><div class="row"><button class="btn ghost small" data-act="cancelNew">Nei, behold</button><button class="btn small" style="background:var(--red)" data-act="reallyNew">Ja, nytt spill</button></div></div>`
    :`<div class="row">${S.rounds.length&&S.editing===null?'<button class="btn ghost small" data-act="undo">Angre siste runde</button>':''}<button class="btn ghost small" data-act="newGame">Nytt spill</button></div>`}
    <p class="hint">Spillet lagres på denne telefonen, også om du lukker siden.</p></section>`;
}

// ---- events ----
document.addEventListener('click',ev=>{
  if(MODE==='board')return;
  const b=ev.target.closest('button,[data-edit]');if(!b)return;
  const a=b.dataset.act;
  if(a==='showShare'||a==='hideShare'){showShare=a==='showShare';render();return}
  if(a==='copy'){
    const done=()=>{const c=$('#copybtn');if(c)c.textContent='Kopiert'};
    try{navigator.clipboard.writeText(BOARD_URL).then(done,()=>selectLink())}catch(e){selectLink()}
    return;
  }
  if(b.dataset.rm!==undefined){S.players.splice(+b.dataset.rm,1);if(S.settings.firstDealer>=S.players.length)S.settings.firstDealer=0;return commit()}
  if(b.dataset.step){
    const id=b.dataset.step,d=+b.dataset.d,k=id[0],i=+id.slice(1),e=S.draft.e[i];
    if(k==='b')e.b=Math.max(0,Math.min(S.draft.cards,e.b+d));
    if(k==='t')e.t=Math.max(0,Math.min(S.draft.cards,e.t+d));
    if(k==='m')e.m=(e.m||0)+d;
    return commit();
  }
  if(b.dataset.edit!==undefined&&S.phase!=='setup'){
    const ri=+b.dataset.edit,r=S.rounds[ri];
    S.stash=S.editing===null?S.draft:S.stash;
    S.editing=ri;S.draft={cards:r.cards,stage:S.settings.scoring==='manual'?'tricks':'tricks',e:r.e.map(e=>({b:e.b,t:e.t,m:e.p}))};
    if(S.phase==='done')S.phase='play';S.wasDone=S.rounds.length===schedule().length;
    commit();$('#round')&&$('#round').scrollIntoView({behavior:'smooth',block:'start'});return;
  }
  switch(a){
    case 'addp':S.players.push('');commit();const l=document.querySelector(`#pl${S.players.length-1}`);l&&l.focus();break;
    case 'start':
      S.players=S.players.map(p=>p.trim()).filter(Boolean);
      S.settings.maxCards=Math.min(S.settings.maxCards,maxAllowed(S.players.length));
      if(S.settings.firstDealer>=S.players.length)S.settings.firstDealer=0;
      S.rounds=[];S.phase='play';S.editing=null;S.draft=newDraft();commit();break;
    case 'toTricks':S.draft.stage='tricks';S.draft.e.forEach(e=>e.t=e.b);commit();break;
    case 'toBids':S.draft.stage='bids';commit();break;
    case 'saveRound':{
      const manual=S.settings.scoring==='manual';
      const r={cards:S.draft.cards,e:S.draft.e.map(e=>({b:e.b,t:e.t,p:score(e.b,e.t,e.m)}))};
      if(S.editing!==null){S.rounds[S.editing]=r;S.editing=null;S.draft=S.stash||newDraft();S.stash=null;}
      else{S.rounds.push(r);S.draft=null;}
      if(S.rounds.length>=schedule().length){S.phase='done';S.draft=null}
      else if(!S.draft)S.draft=newDraft();
      commit();window.scrollTo({top:0,behavior:'smooth'});break;}
    case 'cancelEdit':S.editing=null;S.draft=S.stash||newDraft();S.stash=null;if(S.rounds.length>=schedule().length){S.phase='done';S.draft=null}commit();break;
    case 'undo':S.rounds.pop();S.phase='play';S.draft=newDraft();commit();break;
    case 'newGame':S.confirmNew=true;commit();break;
    case 'cancelNew':S.confirmNew=false;commit();break;
    case 'reallyNew':{const p=S.players,st=S.settings;S=JSON.parse(JSON.stringify(DEMO));S.players=p;S.settings=st;S.settings.firstDealer=(st.firstDealer+1)%Math.max(p.length,1);commit();break;}
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.pl!==undefined){S.players[+t.dataset.pl]=t.value;save();
    const btn=document.querySelector('[data-act="start"]');if(btn)btn.disabled=S.players.filter(p=>p.trim()).length<2;return}
  if(t.dataset.man!==undefined){S.draft.e[+t.dataset.man].m=parseInt(t.value,10)||0;save();return}
});
document.addEventListener('change',ev=>{
  const t=ev.target,k=t.dataset.set;
  if(t.dataset.pl!==undefined){commit();return}
  if(!k)return;
  if(k==='dealerBlock')S.settings[k]=t.checked;
  else if(k==='maxCards'||k==='firstDealer')S.settings[k]=+t.value;
  else S.settings[k]=t.value;
  commit();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.dataset.edit!==undefined)ev.target.click()});

function selectLink(){const el=$('#boardlink');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function commit(){save();schedulePush();
  const f=document.activeElement&&document.activeElement.id;
  render();
  if(f){const el=document.getElementById(f);el&&el.focus()}
}
// keep phone screen on during play
async function wake(){try{if('wakeLock' in navigator&&(S.phase==='play'||MODE==='board'))await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
document.addEventListener('click',wake,{once:true});
if(MODE==='board')S=JSON.parse(JSON.stringify(DEMO));
render();
connect();
})();
</script>
</body>
</html>
