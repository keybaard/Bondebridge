<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Poengblokka">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1116" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='18' y='6' width='64' height='88' rx='9' fill='%23fff' stroke='%23141414' stroke-width='4'/%3E%3Ctext x='50' y='66' font-size='44' text-anchor='middle' fill='%23b3121c'%3E%E2%99%A6%3C/text%3E%3C/svg%3E">
<title>Poengblokka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column printed like card stock in two inks (black + card red).
   Standings pinned as card-corner indices; the round is a small playing card; the log is a ruled score pad with a double-ruled sum. */
:root{
  --paper:#f4f4f1;      /* page */
  --stock:#ffffff;      /* card stock surfaces */
  --ink:#141414;        /* black ink */
  --ink-2:#6a6b66;      /* secondary ink */
  --rule:#dcdcd6;       /* hairlines */
  --red:#b3121c;        /* card red: dealer, errors */
  --lead:#9a7208;       /* gold text */
  --silver-ink:#66707b; --bronze-ink:#9b5a2b;  /* readable silver/bronze text */
  --up:#17784a;         /* climbed places */
  --gold:#d9b23c; --silver:#b8c0c8; --bronze:#c7834f;  /* medal fills, readable on both themes */
  --wash:#ecece7;       /* pressed / subtle fill */
  --display:"Funnel Display","Schibsted Grotesk",system-ui,-apple-system,sans-serif;
  --ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1116; --stock:#171a21; --ink:#ecebe6; --ink-2:#9b9ca3; --rule:#2b2f38; --red:#f0565c; --lead:#e6bb45; --silver-ink:#c4cbd3; --bronze-ink:#e0996a; --up:#4fc98a; --wash:#1f232c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1116; --stock:#171a21; --ink:#ecebe6; --ink-2:#9b9ca3; --rule:#2b2f38; --red:#f0565c; --lead:#e6bb45; --silver-ink:#c4cbd3; --bronze-ink:#e0996a; --up:#4fc98a; --wash:#1f232c; color-scheme:dark}

*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:var(--paper);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;
  padding:0 20px 56px;-webkit-text-size-adjust:100%;font-variant-numeric:lining-nums tabular-nums}
[hidden]{display:none!important}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
h1,h2{margin:0;font-weight:500;text-wrap:balance}
h1{font-family:var(--display);font-size:2.6rem;line-height:1;letter-spacing:-.025em;font-weight:700}
h1 em{font-style:normal;font-weight:300;color:var(--ink-2);font-size:.55em;display:block;margin-top:8px;letter-spacing:0}
h2{font-family:var(--display);font-size:1.4rem;font-weight:700;letter-spacing:-.015em}
.sc{font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;font-weight:500;color:var(--ink-2)}
.red{color:var(--red)}
.num{font-family:var(--display);font-weight:600}
p{margin:0}
.note{font-size:.85rem;color:var(--ink-2)}
section{display:flex;flex-direction:column;gap:14px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

/* controls */
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.step,.step output{-webkit-user-select:none;user-select:none}
button:disabled{cursor:not-allowed;opacity:.35}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.btn{display:block;width:100%;padding:16px 20px;border-radius:8px;background:var(--ink);color:var(--paper);font-weight:500;font-size:1rem;letter-spacing:.01em;text-align:center}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btns{display:flex;gap:10px}.btns>*{flex:1}
.btns .btn.line{flex:0 0 auto;width:auto}
.link{font-size:.9rem;color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px;padding:6px 0}
.link:hover{text-decoration-color:var(--ink)}
.links{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:10px 0;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
input[type=text]:focus,select:focus{border-bottom-color:var(--ink);outline:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 10px) 55%,calc(100% - 5px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
select option{color:#141414;background:#fff}

/* header */
header{padding-top:28px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px 16px;flex-wrap:wrap}
header h1{min-width:0}
.status{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;color:var(--ink-2);white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.status.on i{background:var(--red);animation:pulse 1.8s ease-out infinite}
.status.off i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-2)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* standings: card-corner indices */
.standings{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);margin:0 -20px;padding:14px 20px 12px;border-bottom:1px solid var(--rule)}
.idxs{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.idxs::-webkit-scrollbar{display:none}
.idx{flex:0 0 auto;display:flex;flex-direction:column;min-width:52px}
.idx .nm{font-size:.78rem;font-weight:500;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.idx .tot{font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:2rem;line-height:1.05}
.idx .gap{font-size:.72rem;color:var(--ink-2)}
.idx.p1 .tot,.rank.p1 .tt{color:var(--lead)}
.idx.p2 .tot,.rank.p2 .tt{color:var(--silver-ink)}
.idx.p3 .tot,.rank.p3 .tt{color:var(--bronze-ink)}
.idx .nm{display:flex;align-items:center;gap:5px}
.medal{display:inline-grid;place-items:center;flex:0 0 auto;width:1.35em;height:1.35em;border-radius:50%;font-family:var(--display);font-weight:700;font-size:.8em;line-height:1;color:#141414;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.medal.m1{background:var(--gold)}.medal.m2{background:var(--silver)}.medal.m3{background:var(--bronze);color:#fff}
.mv{font-weight:500;white-space:nowrap}
.mv.up{color:var(--up)}.mv.dn{color:var(--red)}

/* the round card */
.round-top{display:flex;gap:20px;align-items:stretch}
.pcard{position:relative;flex:0 0 auto;width:78px;height:110px;border-radius:9px;background:var(--stock);box-shadow:0 0 0 1px var(--rule),0 6px 16px -10px rgba(0,0,0,.35);color:var(--ink)}
.pcard.r{color:var(--red)}
.pcard .ix{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.9;font-family:var(--display);font-weight:600;font-size:1.25rem}
.pcard .ix i{font-style:normal;font-size:.8rem;margin-top:2px}
.pcard .tl{top:7px;left:8px}.pcard .br{bottom:7px;right:8px;transform:rotate(180deg)}
.pcard .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:2.1rem}
.round-meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.round-meta .big{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1.1}
.round-meta .big em{font-style:normal;font-weight:300;color:var(--ink-2)}
.course{display:flex;align-items:flex-end;gap:2px;height:30px}
.course span{flex:1;background:var(--rule);border-radius:1px;min-height:3px}
.course span.done{background:var(--ink-2)}
.course span.now{background:var(--red)}
.stages{display:flex;gap:18px;font-size:.85rem}
.stages span{color:var(--ink-2);padding-bottom:3px}
.stages span.on{color:var(--ink);box-shadow:inset 0 -1.5px 0 var(--ink)}

/* player rows */
.plist{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.prow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.pname{min-width:0;font-weight:500;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname .tag{font-size:.64rem;text-transform:uppercase;letter-spacing:.14em;color:var(--red);margin-left:8px;vertical-align:2px;font-weight:500}
.pname .tag.soft{color:var(--ink-2)}
.starts{font-size:.9rem;color:var(--ink-2);margin-top:4px}
.starts span{color:var(--ink);font-weight:500}
.starts span.me{text-decoration:underline;text-underline-offset:4px}
.seatrow{grid-template-columns:1.6rem 1fr 44px 44px;padding:4px 0;border-bottom:1px solid var(--rule)}
.sname{font-weight:500;padding:10px 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sname .tag{font-size:.64rem;text-transform:uppercase;letter-spacing:.14em;color:var(--red);margin-left:8px;vertical-align:2px;font-weight:500}
.pname .sub{display:block;font-size:.8rem;font-weight:400;color:var(--ink-2)}
.pname .sub b{font-weight:500;color:var(--ink)}
.pname .sub .miss{color:var(--ink-2);font-weight:400;text-decoration:line-through;text-decoration-color:var(--red)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--rule);font-size:1.25rem;line-height:1;color:var(--ink)}
.step button:active:not([aria-disabled]){background:var(--wash)}
.step button[aria-disabled="true"]{opacity:.3;cursor:default}
.step,.prow,.plist{touch-action:manipulation}
.step output{min-width:36px;text-align:center;font-family:var(--display);font-weight:600;font-size:1.7rem;line-height:1}
.step input{width:64px;text-align:center;font-family:var(--display);font-weight:600;font-size:1.4rem;padding:6px 0}
.tally{display:flex;justify-content:space-between;gap:12px;font-size:.9rem;color:var(--ink-2)}
.tally b{color:var(--ink);font-weight:500}
.tally.bad,.tally.bad b{color:var(--red)}

/* score pad */
.pad{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:9px 8px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0;position:sticky;left:0;background:var(--paper)}
thead th{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;font-weight:500;color:var(--ink-2);border-bottom:1px solid var(--ink);max-width:90px;overflow:hidden;text-overflow:ellipsis}
tbody td{border-bottom:1px solid var(--rule)}
tbody tr[data-edit]{cursor:pointer}
tbody tr[data-edit]:hover td{background:var(--wash)}
td .rd{font-family:var(--display);font-weight:600}
td .cd{font-size:.75rem;color:var(--ink-2);margin-left:6px}
td.hit{font-weight:500}
td.miss{color:var(--ink-2)}
td .bt{display:block;font-size:.7rem;color:var(--ink-2);font-weight:400}
tfoot td{border-top:3px double var(--ink);font-family:var(--display);font-weight:600;font-size:1.3rem;padding-top:10px}
tfoot td:first-child{font-family:var(--ui);font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;font-weight:500;color:var(--ink-2);vertical-align:middle}

/* setup */
.players{display:flex;flex-direction:column}
.plrow{display:grid;grid-template-columns:1.6rem 1fr 38px 38px 38px;align-items:center;gap:2px}
.plrow .seat{font-family:var(--display);font-weight:600;color:var(--ink-2)}
.plrow button{height:40px;color:var(--ink-2);font-size:1.2rem;border-radius:50%}
.plrow button.mv{font-size:1rem}
.plrow button[aria-disabled="true"]{opacity:.2;cursor:default}
.plrow button[data-rm]:hover{color:var(--red)}
.plrow button.mv:hover:not([aria-disabled]){color:var(--ink)}
.opts{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.opt{display:grid;grid-template-columns:1fr minmax(0,55%);gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)}
.opt>label,.opt>span{font-size:.95rem}
.opt select{border-bottom:0;text-align:right;text-align-last:right}
.opt.sw{grid-template-columns:1fr auto;padding:12px 0}
.opt.sw small{display:block;color:var(--ink-2);font-size:.8rem;line-height:1.35;margin-top:2px}
.switch{position:relative;width:46px;height:28px;flex:0 0 auto}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1;width:100%;height:100%}
.switch i{pointer-events:none;position:absolute;inset:0;border-radius:14px;background:var(--rule);transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--stock);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+i{background:var(--ink)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--red);outline-offset:2px}

/* share + board */
.qr{align-self:center;background:#fff;padding:16px;border-radius:10px;box-shadow:0 0 0 1px var(--rule);line-height:0}
.qr img,.qr canvas{width:216px;height:216px;max-width:100%}
.linkline{display:flex;gap:10px;align-items:center}
.linkline code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font-size:.8rem;color:var(--ink-2);border-bottom:1px solid var(--rule);padding:8px 0;user-select:all}
.linkline .btn{width:auto;padding:10px 16px;font-size:.9rem}
.ranks{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.rank{display:grid;grid-template-columns:2rem 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.rank .r{font-family:var(--display);font-weight:600;color:var(--ink-2)}
.rank .nm{min-width:0;font-size:1.15rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .nm .sub{display:block;font-size:.8rem;font-weight:400;color:var(--ink-2)}
.rank .tt{font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:2.4rem;line-height:1}
.rank .medal{font-size:1.05rem}
.rank .r{text-align:center}
.bids{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem}
.bids span b{font-family:var(--display);font-weight:600;font-size:1.1rem;margin-left:4px}
.winner{text-align:center;align-items:center;padding:12px 0 4px;gap:6px}
.winner .who{font-family:var(--display);font-size:2.6rem;font-weight:600;line-height:1.05;color:var(--lead)}
.winner .who em{display:block;font-size:.45em;font-style:normal;font-weight:300;color:var(--ink-2);margin-top:6px}
.confirm{display:flex;flex-direction:column;gap:12px;padding:16px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.confirm .btn.danger{background:var(--red);color:#fff}
.empty{padding:22px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);color:var(--ink-2)}
.rank[data-me]{cursor:pointer;-webkit-user-select:none;user-select:none}
.rank.me{background:var(--wash);margin:0 -20px;padding-left:20px;padding-right:20px;box-shadow:inset 3px 0 0 var(--ink)}
.you{font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;font-weight:500;background:var(--ink);color:var(--paper);border-radius:4px;padding:2px 6px;margin-left:8px;vertical-align:3px}
th.me{color:var(--ink)}
td.me{background:var(--wash);font-weight:600}
tfoot td.me{background:var(--wash)}
.bids span.me{font-weight:600}
.bids span.me b{text-decoration:underline;text-underline-offset:4px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.games button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--rule);text-align:left}
.games button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--stock)}
.games b{font-family:var(--display);font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.games small{font-size:.78rem;color:var(--ink-2);line-height:1.3}
.sdrow{align-items:start}
.pcol{min-width:0;display:flex;flex-direction:column;gap:8px}
.hcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.82rem;font-weight:500;padding:6px 11px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink-2);min-height:32px}
.chip.on{background:var(--ink);color:var(--paper);box-shadow:none}
.chip.r.on{background:var(--red);color:#fff}
.pass{font-size:.85rem;font-weight:500}
.meter{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.meter i{display:block;height:100%;background:var(--red)}
.course.flat{height:10px}
.course.flat span{height:100%}
.games.small button{padding:10px 12px}
.games.small b{font-size:1rem}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink)}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px 10px 12px 0;border-bottom:1px solid var(--rule);min-width:0}
.tile .v{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1.05;letter-spacing:-.02em}
.tile .note{font-size:.75rem}
.h2h{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);min-width:0}
.hrow>span:first-child{min-width:0}
.hrow .score{font-family:var(--display);font-size:1.25rem;white-space:nowrap}
.hrow .score.up{color:var(--up)}.hrow .score.dn{color:var(--red)}
.hrow .score small{font-family:var(--ui);font-size:.75rem;color:var(--ink-2)}
.confirmrow{background:var(--wash);margin:0 -20px;padding-left:20px;padding-right:20px}
.stbl td:first-child{font-weight:500}
.stbl tr.me td{background:var(--wash);font-weight:600}
.comment{gap:8px;padding:0 0 16px;margin-top:-12px;border-bottom:1px solid var(--rule)}
.comment .cl{color:var(--ink)}
.comment p{font-family:var(--display);font-weight:400;font-size:1.2rem;line-height:1.3;letter-spacing:-.01em;text-wrap:pretty}
.comment p+p{font-size:1rem;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
const KEY='bondebridge-v1';
const NTFY='https://ntfy.sh/';
const params=new URLSearchParams(location.search);
const VIEW_ID=(params.get('g')||'').replace(/[^a-z0-9]/gi,'');
let MODE=VIEW_ID?'board':'keeper';
let SYNC=MODE==='board'?'wait':'idle';   // idle | wait | on | off
let REMOTE=null;
let showShare=false;
function gameId(){ // random per phone, so the QR code stays the same all evening
  let id=null;try{id=localStorage.getItem(KEY+'-id')}catch(e){}
  if(!id){const a='abcdefghijkmnpqrstuvwxyz23456789';id='';crypto.getRandomValues(new Uint8Array(14)).forEach(x=>id+=a[x%a.length]);try{localStorage.setItem(KEY+'-id',id)}catch(e){}}
  return id;
}
const GID=MODE==='board'?VIEW_ID:gameId();
const TOPIC='bondebridge-'+GID;
const BOARD_URL=location.origin+location.pathname+'?g='+GID;
const load=()=>{try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}};
let ME=null;try{ME=localStorage.getItem(KEY+'-me')}catch(e){}
const meIdx=()=>MODE==='board'&&ME!==null?S.players.indexOf(ME):-1;
const save=()=>{if(MODE==='board')return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const SD_DEFAULT={hearts:'one',queen:13,jack:0,moon:'others',end:'limit',limit:100,rounds:10,pass:'none'};
const DEMO={game:'bb',phase:'setup',players:['Ola','Kari','Per','Lise'],
  settings:{maxCards:10,order:'down',scoring:'ten',dealerBlock:false,zeroFive:false,firstDealer:0},
  sd:Object.assign({},SD_DEFAULT),
  rounds:[],draft:null,editing:null,confirmNew:false};
let S=load()||JSON.parse(JSON.stringify(DEMO));
function migrate(){
  if(!S.game)S.game='bb';
  if(!S.sd)S.sd=Object.assign({},SD_DEFAULT);
  for(const k in SD_DEFAULT)if(S.sd[k]===undefined)S.sd[k]=SD_DEFAULT[k];
  if(S.settings&&S.settings.zeroFive===undefined)S.settings.zeroFive=false;
}
migrate();

// ---- helpers ----
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const SUITS=['♠','♥','♣','♦'];
const WORDS=['null','én','to','tre','fire','fem'];
const cap=w=>w.charAt(0).toUpperCase()+w.slice(1);
const signed=p=>(p>0?'+':p<0?'−':'')+Math.abs(p);
function stepper(id,val,min,max,label){
  return `<div class="step"><button type="button" data-step="${id}" data-d="-1" aria-label="Én mindre for ${label}" ${val<=min?'aria-disabled="true"':''}>−</button>
  <output aria-live="polite">${val}</output><button type="button" data-step="${id}" data-d="1" aria-label="Én mer for ${label}" ${val>=max?'aria-disabled="true"':''}>+</button></div>`;
}
function cardFace(idx,suit){
  const red=suit==='♥'||suit==='♦';
  return `<div class="pcard ${red?'r':''}" aria-hidden="true"><span class="ix tl">${idx}<i>${suit}</i></span><span class="pip">${suit}</span><span class="ix br">${idx}<i>${suit}</i></span></div>`;
}
function totals(){const t=S.players.map(()=>0);S.rounds.forEach(r=>r.e.forEach((e,i)=>t[i]+=e.p));return t}
function dealerFor(ri){return (S.settings.firstDealer+ri)%S.players.length}

/* ================================================================
   GAMES. Everything that differs between card games lives here;
   the rest of the app (standings, board, sync, pad) is shared.
   ================================================================ */
const GAMES={};

// ---------- Bondebridge ----------
GAMES.bb={
  name:'Bondebridge',blurb:'Meld stikk, treff nøyaktig',low:false,minPlayers:2,
  schedule(){
    const m=S.settings.maxCards,down=[],up=[];
    for(let c=m;c>=1;c--)down.push(c);
    for(let c=1;c<=m;c++)up.push(c);
    return S.settings.order==='down'?down.concat(up):up.concat(down);
  },
  totalRounds(){return this.schedule().length},
  isOver(){return S.rounds.length>=this.totalRounds()},
  maxAllowed(n){return Math.max(1,Math.floor(52/Math.max(n,1)))},
  score(bid,tricks,manual,cards){
    const st=S.settings;
    if(st.scoring==='manual')return manual||0;
    if(bid===tricks){
      if(st.zeroFive&&bid===0&&cards<=5)return 5;   // house rule: a made zero is only worth 5 once rounds are 5 cards or fewer
      return 10+tricks;
    }
    if(st.scoring==='minus')return -Math.abs(bid-tricks);
    return 0;
  },
  newDraft(){
    const cards=this.schedule()[S.rounds.length];
    return {cards,stage:S.settings.scoring==='manual'?'tricks':'bids',e:S.players.map(()=>({b:0,t:0,m:0}))};
  },
  editDraft(r){return {cards:r.cards,stage:'tricks',e:r.e.map(e=>({b:e.b,t:e.t,m:e.p}))}},
  finish(d){return {cards:d.cards,e:d.e.map(e=>({b:e.b,t:e.t,p:this.score(e.b,e.t,e.m,d.cards)}))}},
  face(ri,cards){return cardFace(cards,SUITS[ri%4])},
  headline(ri,cards,dealer){return `${cards} kort <em>· ${esc(S.players[dealer])} gir</em>`},
  progress(ri){
    const sch=this.schedule(),m=Math.max(...sch);
    return `<div class="course" aria-hidden="true">${sch.map((c,i)=>`<span class="${i<ri?'done':i===ri?'now':''}" style="height:${Math.max(10,Math.round(c/m*100))}%"></span>`).join('')}</div>`;
  },
  step(k,i,dir){
    const e=S.draft.e[i];
    if(k==='b')e.b=Math.max(0,Math.min(S.draft.cards,e.b+dir));
    if(k==='t')e.t=Math.max(0,Math.min(S.draft.cards,e.t+dir));
    if(k==='m')e.m=(e.m||0)+dir;
  },
  entry(order,name,editing){
    const d=S.draft,cards=d.cards,manual=S.settings.scoring==='manual';
    const bidSum=d.e.reduce((a,e)=>a+e.b,0),trickSum=d.e.reduce((a,e)=>a+e.t,0);
    let rows='',tally='',action='',stages='';
    if(manual){
      rows=order.map(i=>`<div class="prow">${name(i)}<div class="step"><button type="button" data-step="m${i}" data-d="-1" aria-label="Minus">−</button><input type="number" id="m${i}" data-man="${i}" value="${d.e[i].m}" inputmode="numeric" aria-label="Poeng for ${esc(S.players[i])}"><button type="button" data-step="m${i}" data-d="1" aria-label="Pluss">+</button></div></div>`).join('');
      action=`<button class="btn" data-act="saveRound">${editing?'Lagre endringen':'Lagre runden'}</button>`;
    }else if(d.stage==='bids'){
      rows=order.map(i=>`<div class="prow">${name(i)}${stepper('b'+i,d.e[i].b,0,cards,esc(S.players[i]))}</div>`).join('');
      const blocked=S.settings.dealerBlock&&bidSum===cards;
      const txt=blocked?'Giveren må melde noe annet':bidSum>cards?`${bidSum-cards} over – noen må bomme`:bidSum<cards?`${cards-bidSum} under – noen får for mange`:'Går akkurat opp';
      tally=`<div class="tally ${blocked?'bad':''}"><span>Meldt <b>${bidSum}</b> av ${cards}</span><span>${txt}</span></div>`;
      action=`<button class="btn" data-act="toTricks" ${blocked?'disabled':''}>Spill runden</button>`;
    }else{
      rows=order.map(i=>{const e=d.e[i],p=this.score(e.b,e.t,0,cards),hit=e.b===e.t;
        return `<div class="prow">${name(i,`meldte ${e.b} · ${hit?`<b>${signed(p)}</b>`:`<span class="miss">${signed(p)}</span>`}`)}${stepper('t'+i,e.t,0,cards,esc(S.players[i]))}</div>`}).join('');
      const ok=trickSum===cards;
      tally=`<div class="tally ${ok?'':'bad'}"><span>Stikk <b>${trickSum}</b> av ${cards}</span><span>${ok?'Stemmer':trickSum<cards?`${cards-trickSum} mangler`:`${trickSum-cards} for mange`}</span></div>`;
      action=`<div class="btns"><button class="btn line" data-act="toBids" aria-label="Tilbake til meldinger">←</button><button class="btn" data-act="saveRound" ${ok?'':'disabled'}>${editing?'Lagre endringen':'Lagre runden'}</button></div>`;
    }
    if(!manual)stages=`<div class="stages"><span class="${d.stage==='bids'?'on':''}">Meldinger</span><span class="${d.stage==='tricks'?'on':''}">Stikk</span></div>`;
    return {rows,tally,action,stages};
  },
  roundLabel(r){return `<span class="cd">${r.cards} kort</span>`},
  cell(r,i){const e=r.e[i],manual=S.settings.scoring==='manual',hit=e.b===e.t;
    return {cls:manual?'':hit?'hit':'miss',detail:manual?'':`${e.b}/${e.t}`}},
  padNote(){return S.settings.scoring==='manual'?'':'meldt / tatt'},
  liveNow(n){
    return n.bids?`<div class="bids">${n.bids.map((b,i)=>`<span class="${i===meIdx()?'me':''}">${esc(S.players[i])}<b>${b}</b></span>`).join('')}</div><div class="tally"><span>Meldt <b>${n.bids.reduce((a,b)=>a+b,0)}</b> av ${n.cards}</span></div>`
      :'<p class="note">Venter på meldingene.</p>';
  },
  liveBids(){return (S.settings.scoring!=='manual'&&S.draft&&S.draft.stage==='tricks')?S.draft.e.map(e=>e.b):0},
  setup(sw){
    const n=S.players.filter(p=>p.trim()).length,cap=this.maxAllowed(n),mc=Math.min(S.settings.maxCards,cap),s=S.settings;
    return `<div class="opts">
      <div class="opt"><label for="mc">Flest kort</label><select id="mc" data-set="maxCards">${Array.from({length:cap},(_,i)=>i+1).reverse().map(c=>`<option ${c===mc?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="opt"><label for="ord">Rekkefølge</label><select id="ord" data-set="order"><option value="down" ${s.order==='down'?'selected':''}>${mc} ned til 1 og opp</option><option value="up" ${s.order==='up'?'selected':''}>1 opp til ${mc} og ned</option></select></div>
      <div class="opt"><label for="sc">Poeng</label><select id="sc" data-set="scoring">
        <option value="ten" ${s.scoring==='ten'?'selected':''}>10 + stikk, bom gir 0</option>
        <option value="minus" ${s.scoring==='minus'?'selected':''}>10 + stikk, bom gir minus</option>
        <option value="manual" ${s.scoring==='manual'?'selected':''}>Før poeng for hånd</option></select></div>
      ${dealerOpt()}
      ${s.scoring==='manual'?'':sw('zeroFive',s.zeroFive,'Nullmelding gir 5 poeng','Når runden har 5 kort eller færre, gir det å melde og klare 0 stikk 5 poeng i stedet for 10.')}
      ${sw('dealerBlock',s.dealerBlock,'Giver kan ikke gå opp','Summen av meldingene får ikke bli lik antall kort.')}
    </div>
    <p class="note">${mc*2} runder. Med ${n||'?'} spillere går det maks ${cap} kort hver.</p>`;
  },
  onStart(){S.settings.maxCards=Math.min(S.settings.maxCards,this.maxAllowed(S.players.length))},
  comments(add,c){
    const {R,n,N,nm,pick}=c;
    if(S.settings.scoring==='manual')return;
    const hit=(k,i)=>R[k].e[i].b===R[k].e[i].t;
    for(let i=0;i<N;i++){
      let h=0;for(let k=n-1;k>=0&&hit(k,i);k--)h++;
      let m=0;for(let k=n-1;k>=0&&!hit(k,i);k--)m++;
      if(h>=3)add(50+h*5,pick([`${nm(i)} har klart meldingen ${h} runder på rad.`,`${nm(i)} er varm: ${h} treff på rad.`],5+i),i);
      if(m>=3)add(56+m*5,pick([`${nm(i)} har bommet ${m} runder på rad. Kanskje prøve å melde null?`,`${m} bom på rad for ${nm(i)}. Formkurven peker nedover.`],6+i),i);
    }
    const hits=R[n-1].e.filter(e=>e.b===e.t).length;
    if(hits===N)add(58,pick([`Alle klarte meldingen i runde ${n}. Fredelig bord.`,`Runde ${n}: full klaff for alle.`],7));
    if(hits===0)add(82,pick([`Ingen klarte meldingen i runde ${n}. Totalt kaos.`,`Runde ${n}: null treff rundt bordet.`],8));
    R[n-1].e.forEach((e,i)=>{if(e.b>=5&&e.b===e.t)add(52+e.b*3,`${nm(i)} meldte ${e.b} og tok alle ${e.b}. Sterkt.`,i)});
    if(n>=6){
      const rate=S.players.map((_,i)=>R.filter((r,k)=>hit(k,i)).length/n);
      const best=rate.indexOf(Math.max(...rate));
      add(30,`${nm(best)} har truffet ${Math.round(rate[best]*100)} % av meldingene – best ved bordet.`,best);
      const zeros=S.players.map((_,i)=>R.filter(r=>r.e[i].b===0&&r.e[i].t===0).length),z=Math.max(...zeros),zi=zeros.indexOf(z);
      if(z>=3&&zeros.filter(x=>x===z).length===1)add(34,`${nm(zi)} har klart ${z} nullmeldinger. Nulleksperten ved bordet.`,zi);
    }
  },
  encodeSettings(){const st=S.settings;return [st.maxCards,st.order,st.scoring,st.firstDealer,st.zeroFive?1:0]},
  decodeSettings(a){return {maxCards:a[0],order:a[1],scoring:a[2],firstDealer:a[3],zeroFive:!!a[4],dealerBlock:false}},
  encodeRound(r){return [r.cards].concat(...r.e.map(e=>[e.b,e.t,e.p]))},
  decodeRound(a,N){return {cards:a[0],e:Array.from({length:N},(_,i)=>({b:a[1+i*3],t:a[2+i*3],p:a[3+i*3]}))}},
};

// ---------- Spar dame ----------
GAMES.sd={
  name:'Spar dame',blurb:'Unngå hjerter og damen',low:true,minPlayers:3,
  totalRounds(){return S.sd.end==='rounds'?S.sd.rounds:null},
  isOver(){
    if(S.sd.end==='rounds')return S.rounds.length>=S.sd.rounds;
    return S.rounds.length>0&&Math.max(...totals())>=S.sd.limit;
  },
  hv(){return S.sd.hearts==='one'?1:10},
  aceExtra(){return S.sd.hearts==='tenAce'?10:0},
  penalty(){return 13*this.hv()+this.aceExtra()+S.sd.queen},  // everything there is to take in one hand
  moonOf(d){if(S.sd.moon==='off'||d.q<0)return -1;const i=d.e.findIndex(e=>e.h===13);return i>=0&&i===d.q?i:-1},
  points(d){
    const sd=S.sd,hv=this.hv(),ax=this.aceExtra(),J=+sd.jack||0,moon=this.moonOf(d);
    const jackOf=i=>d.j===i?J:0;
    if(moon>=0){
      if(sd.moon==='redeal')return d.e.map(()=>0);
      if(sd.moon==='minus')return d.e.map((_,i)=>i===moon?-this.penalty()+jackOf(i):jackOf(i));
      return d.e.map((_,i)=>i===moon?jackOf(i):this.penalty()+jackOf(i));   // 'others'
    }
    return d.e.map((e,i)=>e.h*hv+(d.a===i?ax:0)+(d.q===i?sd.queen:0)+jackOf(i));
  },
  newDraft(){return {q:-1,j:-1,a:-1,e:S.players.map(()=>({h:0}))}},
  editDraft(r){return {q:r.q,j:r.j,a:r.a,e:r.e.map(e=>({h:e.h}))}},
  finish(d){const p=this.points(d);return {q:d.q,j:d.j,a:d.a,moon:this.moonOf(d),e:d.e.map((e,i)=>({h:e.h,p:p[i]}))}},
  face(){return cardFace('D','♠')},
  passFor(ri){
    const p=S.sd.pass,N=S.players.length;
    if(p==='none')return '';
    if(p==='l2')return 'Send 2 kort til venstre';
    if(p==='l3')return 'Send 3 kort til venstre';
    const cyc=N===4?['til venstre','til høyre','over bordet',null]:['til venstre','til høyre',null];
    const dir=cyc[ri%cyc.length];
    return dir?`Send 3 kort ${dir}`:'Ingen kortbytte denne runden';
  },
  headline(ri,cards,dealer){return `${esc(S.players[dealer])} gir`},
  progress(ri){
    const pass=this.passFor(ri);
    let bar='';
    if(S.sd.end==='rounds'){
      bar=`<div class="course flat" aria-hidden="true">${Array.from({length:S.sd.rounds},(_,i)=>`<span class="${i<ri?'done':i===ri?'now':''}"></span>`).join('')}</div>`;
    }else{
      const t=totals(),hi=Math.max(0,...t),pct=Math.min(100,Math.round(hi/S.sd.limit*100));
      bar=`<div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div><div class="note">Høyeste sum ${hi} av ${S.sd.limit}</div>`;
    }
    return `${pass?`<div class="pass">${pass}</div>`:''}${bar}`;
  },
  step(k,i,dir){if(k==='h'){const e=S.draft.e[i];e.h=Math.max(0,Math.min(13,e.h+dir))}},
  pickCard(card,i){const d=S.draft;d[card]=d[card]===i?-1:i},
  entry(order,name,editing){
    const d=S.draft,sd=S.sd,hSum=d.e.reduce((a,e)=>a+e.h,0);
    const pts=this.points(d),moon=this.moonOf(d);
    const chip=(card,i,label,red)=>`<button type="button" class="chip ${red?'r':''} ${d[card]===i?'on':''}" data-card="${card}" data-i="${i}" aria-pressed="${d[card]===i}">${label}</button>`;
    const rows=order.map(i=>`<div class="prow sdrow"><div class="pcol">${name(i,`<b>${signed(pts[i])}</b> poeng`)}
      <div class="chips">${chip('q',i,'D♠',false)}${+sd.jack?chip('j',i,'Kn♦',true):''}${sd.hearts==='tenAce'?chip('a',i,'E♥',true):''}</div></div>
      <div class="hcol"><span class="sc">Hjerter</span>${stepper('h'+i,d.e[i].h,0,13,esc(S.players[i]))}</div></div>`).join('');
    const miss=[];
    if(hSum!==13)miss.push(hSum<13?`${13-hSum} hjerter mangler`:`${hSum-13} hjerter for mye`);
    if(d.q<0)miss.push('hvem tok spar dame?');
    if(+sd.jack&&d.j<0)miss.push('hvem tok ruter knekt?');
    if(sd.hearts==='tenAce'){if(d.a<0)miss.push('hvem tok hjerter ess?');else if(d.e[d.a].h<1)miss.push('den som tok hjerter ess må ha minst én hjerter');}
    const ok=!miss.length;
    const moonTxt=moon>=0?`${esc(S.players[moon])} skyter månen!`:'';
    const tally=`<div class="tally ${ok?'':'bad'}"><span>Hjerter <b>${hSum}</b> av 13</span><span>${ok?(moonTxt||'Stemmer'):cap(miss[0])}</span></div>`;
    const action=`<button class="btn" data-act="saveRound" ${ok?'':'disabled'}>${editing?'Lagre endringen':'Lagre runden'}</button>`;
    return {rows,tally,action,stages:`<p class="note">Legg inn antall hjerter for hver, og trykk på kortet hos den som tok det.</p>`};
  },
  roundLabel(r){return r.moon>=0?'<span class="cd">måne</span>':''},
  cell(r,i){const e=r.e[i],bits=[];
    if(e.h)bits.push(e.h+'♥');if(r.q===i)bits.push('D♠');if(r.j===i)bits.push('Kn♦');
    return {cls:e.p<=0?'hit':'miss',detail:bits.join(' ')||'–'}},
  padNote(){return 'hjerter og kort tatt'},
  liveNow(n){return ''},
  liveBids(){return 0},
  setup(sw){
    const sd=S.sd,n=S.players.filter(p=>p.trim()).length;
    const o=(v,cur,label)=>`<option value="${v}" ${String(v)===String(cur)?'selected':''}>${label}</option>`;
    const r=n?52%n:0,out=Array.from({length:r},(_,k)=>k+2);
    const remove=n<3?'Spar dame trenger minst 3 spillere.':r?`Med ${n} spillere: ta ut kløver ${out.length>1?out.slice(0,-1).join(', ')+' og '+out.at(-1):out[0]}, så får alle ${Math.floor(52/n)} kort.`:`Med ${n} spillere brukes hele kortstokken, ${52/n} kort hver.`;
    return `<div class="opts">
      <div class="opt"><label for="sd-hearts">Hjerter</label><select id="sd-hearts" data-sd="hearts">${o('one',sd.hearts,'1 poeng hver')}${o('ten',sd.hearts,'10 poeng hver')}${o('tenAce',sd.hearts,'10 hver, ess 20')}</select></div>
      <div class="opt"><label for="sd-queen">Spar dame</label><select id="sd-queen" data-sd="queen">${o(13,sd.queen,'13 poeng')}${o(100,sd.queen,'100 poeng')}</select></div>
      <div class="opt"><label for="sd-jack">Ruter knekt</label><select id="sd-jack" data-sd="jack">${o(0,sd.jack,'Teller ikke')}${o(-10,sd.jack,'−10 poeng')}${o(-50,sd.jack,'−50 poeng')}${o(-100,sd.jack,'−100 poeng')}</select></div>
      <div class="opt"><label for="sd-moon">Skyte månen</label><select id="sd-moon" data-sd="moon">${o('others',sd.moon,'Andre får poengene')}${o('minus',sd.moon,'Skytteren får minus')}${o('redeal',sd.moon,'Ingen poeng, ny giv')}${o('off',sd.moon,'Ingen regel')}</select></div>
      <div class="opt"><label for="sd-end">Slutt</label><select id="sd-end" data-sd="end">${o('limit',sd.end,'Ved poenggrense')}${o('rounds',sd.end,'Fast antall runder')}</select></div>
      ${sd.end==='limit'
        ?`<div class="opt"><label for="sd-limit">Poenggrense</label><select id="sd-limit" data-sd="limit">${[50,100,150,200,300,500].map(v=>o(v,sd.limit,v+' poeng')).join('')}</select></div>`
        :`<div class="opt"><label for="sd-rounds">Antall runder</label><select id="sd-rounds" data-sd="rounds">${[4,5,6,8,10,12,15,20].map(v=>o(v,sd.rounds,v+' runder')).join('')}</select></div>`}
      <div class="opt"><label for="sd-pass">Kortbytte</label><select id="sd-pass" data-sd="pass">${o('none',sd.pass,'Ingen')}${o('l2',sd.pass,'2 til venstre')}${o('l3',sd.pass,'3 til venstre')}${o('rot',sd.pass,'3, roterende')}</select></div>
      ${dealerOpt()}
    </div>
    <p class="note">Lavest sum vinner. Skyte månen betyr å ta alle hjerterne og spar dame i samme runde. ${remove}</p>`;
  },
  onStart(){},
  comments(add,c){
    const {R,n,N,nm,pick,pts}=c,last=R[n-1];
    if(last.moon>=0)add(98,pick([`${nm(last.moon)} skjøt månen! Alle hjerter og damen i én runde.`,`Månelanding: ${nm(last.moon)} tok absolutt alt.`],1),last.moon);
    if(last.q>=0&&last.moon<0){
      const qi=last.q,times=R.filter(r=>r.q===qi).length,prevSame=n>=2&&R[n-2].q===qi;
      if(prevSame)add(74,pick([`Spar dame liker ${nm(qi)}: to runder på rad.`,`${nm(qi)} tok spar dame igjen. Hun har flyttet inn.`],2),qi);
      else if(times>=3)add(60+times*2,`Spar dame har havnet hos ${nm(qi)} ${times} ganger i kveld.`,qi);
      else add(36,pick([`${nm(qi)} fikk spar dame denne runden.`,`Damen gikk til ${nm(qi)}.`],3),qi);
    }
    last.e.forEach((e,i)=>{if(e.h===13&&last.q!==i)add(70,`${nm(i)} tok alle 13 hjerterne, men slapp unna damen.`,i)});
    for(let i=0;i<N;i++){let z=0;for(let k=n-1;k>=0&&R[k].e[i].p<=0;k--)z++;
      if(z>=3)add(58+z*4,pick([`${nm(i)} har gått helt fri ${z} runder på rad.`,`${z} rene runder på rad for ${nm(i)}. Teflon.`],4+i),i)}
    const clean=last.e.map((e,i)=>e.p<=0?i:-1).filter(i=>i>=0);
    if(clean.length===1&&last.moon<0)add(34,`${nm(clean[0])} var den eneste som gikk fri i runde ${n}.`,clean[0]);
    if(last.j>=0&&+S.sd.jack)add(40,`${nm(last.j)} fanget ruter knekt og trekker fra ${-S.sd.jack}.`,last.j);
    if(S.sd.end==='limit'&&S.phase!=='done'){
      const worst=pts.indexOf(Math.max(...pts)),left=S.sd.limit-pts[worst];
      if(left>0&&left<=S.sd.limit*0.2)add(78,`${nm(worst)} er bare ${left} poeng fra ${S.sd.limit}. Spillet kan ta slutt når som helst.`,worst);
    }
  },
  encodeSettings(){const s=S.sd;return [s.hearts,s.queen,s.jack,s.moon,s.end,s.limit,s.rounds,s.pass,S.settings.firstDealer]},
  decodeSettings(a){return {hearts:a[0],queen:a[1],jack:a[2],moon:a[3],end:a[4],limit:a[5],rounds:a[6],pass:a[7]}},
  encodeRound(r){return [r.q,r.j,r.a,r.moon].concat(r.e.map(e=>e.h),r.e.map(e=>e.p))},
  decodeRound(a,N){return {q:a[0],j:a[1],a:a[2],moon:a[3],e:Array.from({length:N},(_,i)=>({h:a[4+i],p:a[4+N+i]}))}},
};

function moves(){ // places gained (+) or lost (−) in the last round
  if(S.rounds.length<2)return S.players.map(()=>0);
  const prev=S.players.map(()=>0);S.rounds.slice(0,-1).forEach(r=>r.e.forEach((e,i)=>prev[i]+=e.p));
  const a=ranksOf(prev),b=ranksOf(totals());return b.map((x,i)=>a[i]-x);
}

// swap two seats mid-game: every round, the draft and the card holders follow the person
function swapSeats(i,j){
  const N=S.players.length,ri=S.editing!==null?S.editing:S.rounds.length,dealer=dealerFor(ri);
  const f=x=>x===i?j:x===j?i:x;
  const fix=o=>{if(!o)return;if(Array.isArray(o.e)){const t=o.e[i];o.e[i]=o.e[j];o.e[j]=t}
    ['q','j','a','moon'].forEach(k=>{if(typeof o[k]==='number'&&o[k]>=0)o[k]=f(o[k])})};
  const P=S.players;[P[i],P[j]]=[P[j],P[i]];
  S.rounds.forEach(fix);fix(S.draft);fix(S.stash);
  S.settings.firstDealer=((f(dealer)-ri)%N+N)%N;
}

// ---- the commentator: finds the most interesting storylines in the score pad ----
function commentary(){
  const R=S.rounds,n=R.length,P=S.players,N=P.length,g=G();
  if(!n||N<2)return [];
  const total=g.totalRounds();
  const cum=[];let run=P.map(()=>0);
  R.forEach(r=>{run=run.map((v,i)=>v+r.e[i].p);cum.push(run)});
  const rk=cum.map(ranksOf),now=rk[n-1],pts=cum[n-1],lastPlace=Math.max(...now);
  const nm=i=>esc(P[i]);
  const pick=(arr,salt)=>arr[(n*7+salt*3)%arr.length];   // varies by round, same on every phone
  const leadersAt=k=>rk[k].map((x,i)=>x===1?i:-1).filter(i=>i>=0);
  const order=pts.map((v,i)=>i).sort((a,b)=>g.low?pts[a]-pts[b]:pts[b]-pts[a]);
  const gap=Math.abs(pts[order[0]]-pts[order[1]]);
  const F=[],used=new Set();
  const add=(w,t,who)=>F.push({w,t,who});

  // from the top to the bottom
  for(let i=0;i<N;i++){
    if(now[i]!==lastPlace||lastPlace===1)continue;
    for(let k=Math.max(0,n-6);k<n-1;k++){
      const L=leadersAt(k);
      if(L.length===1&&L[0]===i){const d=n-1-k;
        add(96,`${nm(i)} ledet etter runde ${k+1}. ${d===1?'Én runde':cap(WORDS[d]||String(d))+' runder'} senere ligger ${nm(i)} sist.`,i);break}
    }
  }
  // lead changes
  if(n>=2){
    const L=leadersAt(n-1),Lp=leadersAt(n-2);
    if(L.length===1&&!Lp.includes(L[0])){const i=L[0],first=!rk.slice(0,n-1).some(x=>x[i]===1);
      add(first?90:76,first?pick([`${nm(i)} tar ledelsen for første gang i kveld.`,`Ny leder: ${nm(i)}! Første gang på toppen i dag.`],1)
        :pick([`${nm(i)} er tilbake i ledelsen.`,`${nm(i)} tar teten tilbake.`],2),i)}
    if(L.length===2&&Lp.length===1)add(70,`Delt ledelse: ${nm(L[0])} og ${nm(L[1])} står likt på toppen.`);
  }
  // jumps
  if(n>=2)for(let i=0;i<N;i++){const m=rk[n-2][i]-now[i];
    if(m>=2)add(68+m*4,pick([`${nm(i)} klatrer ${WORDS[m]||m} plasser på én runde.`,`Rakettfart: ${nm(i)} hopper ${WORDS[m]||m} plasser opp.`],3+i),i);
    if(m<=-2)add(64-m*3,pick([`${nm(i)} raser ${WORDS[-m]||-m} plasser ned.`,`Tung runde for ${nm(i)}, ned ${WORDS[-m]||-m} plasser.`],4+i),i)}
  // game-specific storylines
  g.comments(add,{R,n,N,nm,pick,pts,rk});
  // shape of the race
  if(n>=4){const L0=leadersAt(0);if(L0.length===1&&rk.every(x=>x[L0[0]]===1&&x.filter(y=>y===1).length===1))add(48,`${nm(L0[0])} har ledet hver eneste runde så langt.`,L0[0])}
  const big=g.low?20:30;
  if(n>=3&&gap>=big)add(40,pick([`${nm(order[0])} leder med ${gap} poeng. Resten spiller om sølvet.`,`${gap} poeng skiller ${nm(order[0])} fra resten. Det lukter walkover.`],9),order[0]);
  if(n>=4&&gap>0&&gap<=3)add(46,`Bare ${gap} poeng skiller ${nm(order[0])} og ${nm(order[1])} på toppen.`);
  if(total&&n===total/2)add(86,`Halvveis! ${nm(order[0])} leder${gap?` med ${gap} poeng`:''}.`,order[0]);
  if(total&&n===total-1)add(88,gap?`Én runde igjen. ${nm(order[0])} har ${gap} poeng å gå på.`:`Én runde igjen, og det står likt på toppen!`);
  if(S.phase==='done')add(99,`${nm(order[0])} vinner${gap?` med ${gap} poeng ned til ${nm(order[1])}`:' – på delt førsteplass'}.`,order[0]);

  // strongest two stories, preferably about different people
  F.sort((a,b)=>b.w-a.w);
  const out=[];
  for(const f of F){if(out.length>=2)break;if(f.who!==undefined&&used.has(f.who))continue;if(f.who!==undefined)used.add(f.who);out.push(f.t)}
  return out;
}

  return head+commentView()+now+list+logView();

// ---- wire format: compact, so a long game stays under ntfy's 4 KB message limit ----
function encode(){
  const g=G();
  const n=(S.phase==='play'&&S.draft&&S.editing===null)?[S.rounds.length,S.draft.cards||0,dealerFor(S.rounds.length),g.liveBids()]:0;
  const base={p:S.players,ph:S.phase,r:S.rounds.map(r=>g.encodeRound(r)),n};
  if(S.game==='bb')return Object.assign({v:1,s:g.encodeSettings()},base);   // v1 stays readable by boards opened before this update
  return Object.assign({v:2,g:S.game,s:g.encodeSettings()},base);
}
function decode(d){
  if(!d||!Array.isArray(d.p))return null;
  const game=d.v===1?'bb':d.v===2&&GAMES[d.g]?d.g:null;if(!game)return null;
  const g=GAMES[game],N=d.p.length;
  const out={game,players:d.p.map(String),rounds:(d.r||[]).map(a=>g.decodeRound(a,N)),phase:d.ph,
    now:d.n?{round:d.n[0],cards:d.n[1],dealer:d.n[2],bids:d.n[3]||null}:null};
  if(game==='bb'){out.settings=g.decodeSettings(d.s);out.sd=Object.assign({},SD_DEFAULT)}
  else{out.sd=g.decodeSettings(d.s);out.settings=Object.assign({},DEMO.settings,{firstDealer:d.s[8]||0})}
  return out;
}
let lastPushed='',pushTimer=null,pushing=false;
function schedulePush(){if(MODE!=='keeper')return;clearTimeout(pushTimer);pushTimer=setTimeout(push,700)}
async function push(){
  if(pushing){schedulePush();return}
  if(S.phase==='setup')return; // the board keeps the last game until a new one starts
  const body=JSON.stringify(encode());
  if(body===lastPushed&&SYNC==='on')return;
  pushing=true;
  try{const r=await fetch(NTFY+TOPIC,{method:'POST',body});if(!r.ok)throw new Error(r.status);
    lastPushed=body;if(SYNC!=='on'){SYNC='on';render()}}
  catch(e){if(SYNC!=='off'){SYNC='off';render()}}
  finally{pushing=false}
}
let es=null;
function listen(){
  if(MODE!=='board'||!GID)return;
  try{es&&es.close()}catch(e){}
  es=new EventSource(NTFY+TOPIC+'/sse?since=latest');
  es.onopen=()=>{if(SYNC!=='on'){SYNC='on';render()}};
  es.onmessage=ev=>{
    try{const m=JSON.parse(ev.data);if(m.event&&m.event!=='message')return;
      const g=decode(JSON.parse(m.message));if(!g)return;
      REMOTE=g;S={game:g.game,players:g.players,settings:g.settings,sd:g.sd,rounds:g.rounds,phase:g.phase,draft:null,editing:null};
      SYNC='on';render();}catch(e){}
  };
  es.onerror=()=>{const s=es.readyState===2?'off':'wait';if(SYNC!==s){SYNC=s;render()}};
}
function connect(){
  if(MODE==='board'){listen();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(!es||es.readyState===2))listen()});
  }else if(S.phase!=='setup')schedulePush();
}

// ---- history + stats ----
// Each finished game is one self-contained record with a stable id, so the list can later be
// uploaded as-is to a shared database (one document per game) without changing the stats code.
const HKEY=KEY+'-history',WHOKEY=KEY+'-who';
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function loadH(){try{const h=JSON.parse(localStorage.getItem(HKEY)||'[]');return Array.isArray(h)?h:[]}catch(e){return []}}
function saveH(h){try{localStorage.setItem(HKEY,JSON.stringify(h))}catch(e){}}
function recordGame(){
  if(MODE!=='keeper'||!S.rounds.length)return;
  if(!S.gid)S.gid=rid();
  const t=totals(),h=loadH(),old=h.findIndex(x=>x.id===S.gid);
  const rec={id:S.gid,game:S.game,date:old>=0?h[old].date:new Date().toISOString(),
    players:S.players.slice(),settings:JSON.parse(JSON.stringify(S.game==='bb'?S.settings:S.sd)),
    rounds:JSON.parse(JSON.stringify(S.rounds)),totals:t,ranks:ranksOf(t)};
  if(old>=0)h[old]=rec;else h.push(rec);
  saveH(h);
}
function unrecordGame(){if(!S.gid)return;saveH(loadH().filter(x=>x.id!==S.gid))}

let VIEW='main',STATS_GAME=null,DEL_ID=null;
let WHO=null;try{WHO=localStorage.getItem(WHOKEY)}catch(e){}
const nkey=s=>String(s).trim().toLowerCase();

function computeStats(gameKey){
  const H=loadH().filter(x=>x.game===gameKey).sort((a,b)=>a.date<b.date?-1:1);
  const P={},h2h={};
  const get=name=>{const k=nkey(name);if(!P[k])P[k]={key:k,name,games:0,wins:0,placeSum:0,podium:0,best:null,worst:null,
    rounds:0,pts:0,
    bidRounds:0,hits:0,bidSum:0,zeroTry:0,zeroMade:0,maxMade:0,streak:0,
    queens:0,hearts:0,clean:0,moons:0,jacks:0};
    P[k].name=name;return P[k]};   // latest spelling wins
  const lowWins=gameKey==='sd';
  H.forEach(g=>{
    const N=g.players.length;
    g.players.forEach((name,i)=>{
      const s=get(name),tot=g.totals[i],rk=g.ranks[i];
      s.games++;s.placeSum+=rk;if(rk===1)s.wins++;if(rk<=3)s.podium++;
      if(s.best===null||(lowWins?tot<s.best:tot>s.best))s.best=tot;
      if(s.worst===null||(lowWins?tot>s.worst:tot<s.worst))s.worst=tot;
      let run=0;
      g.rounds.forEach(r=>{
        const e=r.e[i];s.rounds++;s.pts+=e.p;
        if(gameKey==='bb'&&g.settings.scoring!=='manual'){
          s.bidRounds++;s.bidSum+=e.b;
          if(e.b===e.t){s.hits++;run++;if(run>s.streak)s.streak=run;if(e.b>s.maxMade)s.maxMade=e.b}else run=0;
          if(e.b===0){s.zeroTry++;if(e.t===0)s.zeroMade++}
        }
        if(gameKey==='sd'){
          s.hearts+=e.h;if(r.q===i)s.queens++;if(r.moon===i)s.moons++;if(r.j===i)s.jacks++;if(e.p<=0)s.clean++;
        }
      });
    });
    // head to head: a finished ahead of b in this game
    for(let a=0;a<N;a++)for(let b=0;b<N;b++){if(a===b)continue;
      const ka=nkey(g.players[a]),kb=nkey(g.players[b]);
      h2h[ka]=h2h[ka]||{};const c=h2h[ka][kb]=h2h[ka][kb]||{w:0,l:0,t:0,name:g.players[b]};c.name=g.players[b];
      if(g.ranks[a]<g.ranks[b])c.w++;else if(g.ranks[a]>g.ranks[b])c.l++;else c.t++;
    }
  });
  const list=Object.values(P).sort((a,b)=>b.wins-a.wins||(a.placeSum/a.games)-(b.placeSum/b.games)||b.games-a.games);
  return {H,list,h2h};
}
const pct=(a,b)=>b?Math.round(a/b*100)+' %':'–';
const avg=(a,b,d=1)=>b?(a/b).toFixed(d).replace('.',','):'–';
function fmtDate(iso){try{return new Date(iso).toLocaleDateString('nb-NO',{day:'numeric',month:'short',year:'numeric'})}catch(e){return iso.slice(0,10)}}

function statsView(){
  const gk=STATS_GAME||S.game,g=GAMES[gk],{H,list,h2h}=computeStats(gk);
  const all=loadH().length;
  const tabs=`<div class="games small" role="group" aria-label="Velg spill">${Object.entries(GAMES).map(([k,x])=>`<button type="button" data-sgame="${k}" aria-pressed="${gk===k}"><b>${x.name}</b><small>${loadH().filter(h=>h.game===k).length} spill</small></button>`).join('')}</div>`;
  const head=`<header><h1>Statistikk<em>lagret på denne telefonen</em></h1></header><div class="links"><button class="link" data-act="statsBack">← Tilbake til spillet</button></div>`;
  if(!H.length)return head+`<section>${tabs}<p class="empty">${all?`Ingen ferdige spill i ${g.name} ennå.`:'Ingen ferdige spill ennå.'} Spill som føres til slutt på denne telefonen havner her av seg selv.</p></section>`;
  const me=WHO&&list.find(s=>s.key===nkey(WHO));
  const who=`<section><div class="head"><h2>Hvem er du?</h2><span class="note">Velg navnet ditt for å se dine tall</span></div>
    <div class="chips">${list.map(s=>`<button type="button" class="chip ${me&&me.key===s.key?'on':''}" data-who="${esc(s.name)}" aria-pressed="${!!(me&&me.key===s.key)}">${esc(s.name)}</button>`).join('')}</div></section>`;
  const extraHead=gk==='bb'?'Treff':'Damer';
  const extra=s=>gk==='bb'?pct(s.hits,s.bidRounds):avg(s.queens,s.games);
  const board=`<section><div class="head"><h2>Tabell</h2><span class="sc">${H.length} ${H.length===1?'spill':'spill'}</span></div>
    <div class="pad"><table class="stbl"><thead><tr><th>Navn</th><th>Spill</th><th>Seire</th><th>Snittplass</th><th>${extraHead}</th></tr></thead>
    <tbody>${list.map(s=>`<tr class="${me&&me.key===s.key?'me':''}"><td>${esc(s.name)}</td><td>${s.games}</td><td>${s.wins}</td><td>${avg(s.placeSum,s.games)}</td><td>${extra(s)}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">${gk==='bb'?'Treff er andelen runder der meldingen gikk inn.':'Damer er hvor mange ganger per spill man tok spar dame.'}</p></section>`;
  let mine='';
  if(me){
    const s=me,tile=(l,v,sub)=>`<div class="tile"><span class="sc">${l}</span><span class="v">${v}</span>${sub?`<span class="note">${sub}</span>`:''}</div>`;
    const common=[tile('Seire',s.wins,pct(s.wins,s.games)+' av spillene'),tile('Snittplass',avg(s.placeSum,s.games),`${s.podium} pallplasser`),
      tile(gk==='sd'?'Laveste sum':'Beste sum',s.best,`dårligste ${s.worst}`)];
    const spec=gk==='bb'?[tile('Treff',pct(s.hits,s.bidRounds),`${s.hits} av ${s.bidRounds} runder`),tile('Snitt meldt',avg(s.bidSum,s.bidRounds),'stikk per runde'),
        tile('Nullmeldinger',`${s.zeroMade}/${s.zeroTry}`,'klart / forsøkt'),tile('Største klart',s.maxMade||'–','stikk meldt og tatt'),tile('Lengste rekke',s.streak,'treff på rad')]
      :[tile('Spar dame',s.queens,pct(s.queens,s.rounds)+' av rundene'),tile('Hjerter',avg(s.hearts,s.rounds),'per runde'),tile('Rene runder',pct(s.clean,s.rounds),`${s.clean} uten poeng`),
        tile('Månelandinger',s.moons,''),tile(+S.sd.jack||s.jacks?'Ruter knekt':'Poeng per runde',+S.sd.jack||s.jacks?s.jacks:avg(s.pts,s.rounds),'')];
    const opp=Object.values(h2h[s.key]||{}).sort((a,b)=>(b.w+b.l+b.t)-(a.w+a.l+a.t));
    mine=`<section><div class="head"><h2>${esc(s.name)}</h2><span class="sc">${s.games} spill</span></div><div class="tiles">${common.concat(spec).join('')}</div></section>
    <section><div class="head"><h2>Innbyrdes</h2><span class="note">hvem endte foran hvem</span></div>
      <div class="h2h">${opp.map(o=>`<div class="hrow"><span>mot ${esc(o.name)}</span><span class="score ${o.w>o.l?'up':o.w<o.l?'dn':''}"><b>${o.w}</b>–<b>${o.l}</b>${o.t?` <small>(${o.t} likt)</small>`:''}</span></div>`).join('')||'<p class="note">Ingen felles spill ennå.</p>'}</div></section>`;
  }
  const hist=`<section><div class="head"><h2>Spill</h2><span class="note">nyeste først</span></div><div class="h2h">${H.slice().reverse().map(x=>{
    const w=x.players.filter((_,i)=>x.ranks[i]===1).map(esc).join(' og ');
    return DEL_ID===x.id?`<div class="hrow confirmrow"><span>Slette spillet fra ${fmtDate(x.date)}?</span><span class="links"><button class="link" data-act="delNo">Behold</button><button class="link red" data-act="delYes">Slett</button></span></div>`
      :`<div class="hrow"><span><b>${w}</b> vant<small class="note"> · ${fmtDate(x.date)} · ${x.players.length} spillere · ${x.rounds.length} runder</small></span><button type="button" class="link" data-del="${x.id}" aria-label="Slett spillet fra ${fmtDate(x.date)}">Slett</button></div>`}).join('')}</div></section>`;
  return head+`<section>${tabs}</section>`+who+(mine||'')+board+hist;
}

// ---- events ----
function toggleMe(name){
  ME=ME===name?null:name;
  try{ME===null?localStorage.removeItem(KEY+'-me'):localStorage.setItem(KEY+'-me',ME)}catch(e){}
  render();
}
function afterSave(){
  if(G().isOver()){S.phase='done';S.draft=null;recordGame()}
  else{S.phase='play';if(!S.draft)S.draft=newDraft()}
}
document.addEventListener('click',ev=>{
  if(MODE==='board'){const m=ev.target.closest('[data-me]');if(m)toggleMe(m.dataset.me);return}
  const b=ev.target.closest('button,[data-edit]');if(!b||b.disabled||b.getAttribute('aria-disabled')==='true')return;
  const a=b.dataset.act;
  if(a==='showShare'||a==='hideShare'){showShare=a==='showShare';render();return}
  if(a==='copy'){
    const done=()=>{const c=$('#copybtn');if(c)c.textContent='Kopiert'};
    try{navigator.clipboard.writeText(BOARD_URL).then(done,selectLink)}catch(e){selectLink()}
    return;
  }
  if(b.dataset.sgame){STATS_GAME=b.dataset.sgame;DEL_ID=null;render();return}
  if(b.dataset.who!==undefined){WHO=nkey(WHO||'')===nkey(b.dataset.who)?null:b.dataset.who;try{WHO===null?localStorage.removeItem(WHOKEY):localStorage.setItem(WHOKEY,WHO)}catch(e){}render();return}
  if(b.dataset.del){DEL_ID=b.dataset.del;render();return}
  if(b.dataset.game){S.game=b.dataset.game;return commit()}
  if(b.dataset.card){G().pickCard(b.dataset.card,+b.dataset.i);return commit()}
  if(b.dataset.seat!==undefined){
    const i=+b.dataset.seat,j=i+(+b.dataset.d);if(j<0||j>=S.players.length)return;
    swapSeats(i,j);commit();
    const nb=document.querySelector(`[data-seat="${j}"][data-d="${b.dataset.d}"]`);nb&&nb.getAttribute('aria-disabled')!=='true'&&nb.focus({preventScroll:true});return;
  }
  if(b.dataset.mv!==undefined){
    const i=+b.dataset.mv,j=i+(+b.dataset.d);if(j<0||j>=S.players.length)return;
    const P=S.players;[P[i],P[j]]=[P[j],P[i]];
    const fd=S.settings.firstDealer;if(fd===i)S.settings.firstDealer=j;else if(fd===j)S.settings.firstDealer=i; // first dealer follows the person
    commit();const nb=document.querySelector(`[data-mv="${j}"][data-d="${b.dataset.d}"]`);nb&&nb.getAttribute('aria-disabled')!=='true'&&nb.focus({preventScroll:true});return;
  }
  if(b.dataset.rm!==undefined){S.players.splice(+b.dataset.rm,1);if(S.settings.firstDealer>=S.players.length)S.settings.firstDealer=0;return commit()}
  if(b.dataset.step){
    const id=b.dataset.step;G().step(id[0],+id.slice(1),+b.dataset.d);
    return commit();
  }
  if(b.dataset.edit!==undefined&&S.phase!=='setup'){
    const ri=+b.dataset.edit,r=S.rounds[ri];
    S.stash=S.editing===null?S.draft:S.stash;
    S.editing=ri;S.draft=G().editDraft(r);
    if(S.phase==='done')S.phase='play';
    commit();const rd=$('#round');rd&&rd.scrollIntoView({behavior:'smooth',block:'start'});return;
  }
  switch(a){
    case 'addp':{S.players.push('');commit();const l=$(`#pl${S.players.length-1}`);l&&l.focus();break}
    case 'start':
      S.players=S.players.map(p=>p.trim()).filter(Boolean);
      G().onStart();
      if(S.settings.firstDealer>=S.players.length)S.settings.firstDealer=0;
      S.rounds=[];S.phase='play';S.editing=null;S.gid=rid();S.draft=newDraft();commit();window.scrollTo({top:0});break;
    case 'toTricks':S.draft.stage='tricks';S.draft.e.forEach(e=>e.t=e.b);commit();break;
    case 'toBids':S.draft.stage='bids';commit();break;
    case 'saveRound':{
      const r=G().finish(S.draft);
      if(S.editing!==null){S.rounds[S.editing]=r;S.editing=null;S.draft=S.stash||null;S.stash=null}
      else{S.rounds.push(r);S.draft=null}
      afterSave();
      commit();window.scrollTo({top:0,behavior:'smooth'});break;}
    case 'cancelEdit':S.editing=null;S.draft=S.stash||null;S.stash=null;afterSave();commit();break;
    case 'undo':if(S.phase==='done')unrecordGame();S.rounds.pop();S.phase='play';S.draft=newDraft();commit();break;
    case 'seats':SEATING=true;render();{const el=$('#seating');el&&el.scrollIntoView({behavior:'smooth',block:'start'})}break;
    case 'seatsDone':SEATING=false;render();window.scrollTo({top:0,behavior:'smooth'});break;
    case 'stats':VIEW='stats';STATS_GAME=S.game;DEL_ID=null;render();window.scrollTo({top:0});break;
    case 'statsBack':VIEW='main';DEL_ID=null;render();window.scrollTo({top:0});break;
    case 'delYes':saveH(loadH().filter(x=>x.id!==DEL_ID));DEL_ID=null;render();break;
    case 'delNo':DEL_ID=null;render();break;
    case 'newGame':S.confirmNew=true;commit();break;
    case 'cancelNew':S.confirmNew=false;commit();break;
    case 'reallyNew':{const keep={game:S.game,players:S.players,settings:S.settings,sd:S.sd};S=JSON.parse(JSON.stringify(DEMO));Object.assign(S,keep);S.settings.firstDealer=(keep.settings.firstDealer+1)%Math.max(keep.players.length,1);commit();window.scrollTo({top:0});break;}
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.pl!==undefined){S.players[+t.dataset.pl]=t.value;save();
    const btn=$('[data-act="start"]');if(btn)btn.disabled=S.players.filter(p=>p.trim()).length<G().minPlayers;return}
  if(t.dataset.man!==undefined){S.draft.e[+t.dataset.man].m=parseInt(t.value,10)||0;save()}
});
document.addEventListener('change',ev=>{
  if(MODE==='board')return;
  const t=ev.target,k=t.dataset.set,sk=t.dataset.sd;
  if(t.dataset.pl!==undefined){commit();return}
  if(sk){const num=['queen','jack','limit','rounds'].includes(sk);S.sd[sk]=num?+t.value:t.value;commit();return}
  if(!k)return;
  if(t.type==='checkbox')S.settings[k]=t.checked;
  else if(k==='maxCards'||k==='firstDealer')S.settings[k]=+t.value;
  else S.settings[k]=t.value;
  commit();
});
document.addEventListener('keydown',ev=>{if(MODE==='board'&&(ev.key==='Enter'||ev.key===' ')&&ev.target.dataset&&ev.target.dataset.me!==undefined){ev.preventDefault();toggleMe(ev.target.dataset.me);return}if(ev.key==='Enter'&&ev.target.dataset&&ev.target.dataset.edit!==undefined)ev.target.click()});

function selectLink(){const el=$('#boardlink');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function commit(){save();schedulePush();
  const ae=document.activeElement;
  // never re-focus a <select>: on iOS focusing one re-opens its picker right after a choice
  const f=ae&&ae.id&&ae.tagName!=='SELECT'?ae.id:null;
  if(ae&&ae.tagName==='SELECT')ae.blur();
  render();
  if(f){const el=document.getElementById(f);el&&el.focus({preventScroll:true})}
}
async function wake(){try{if('wakeLock' in navigator&&(S.phase==='play'||MODE==='board'))await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
document.addEventListener('click',wake,{once:true});
if(MODE==='board')S=JSON.parse(JSON.stringify(DEMO));
render();
connect();
})();
</script>
